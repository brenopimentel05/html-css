<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        thead {
            background-color: #adadad;
        }

        caption {
            background-color: rgb(204, 204, 204);
            padding: 10px;
            border: 1px solid black;
            font-weight: bold;
        }

        th, td {
            border: 1px solid black;
            width: 300px;
            padding: 10px;
        }

        .num {
            text-align: end;
        }

        tfoot {
            background-color: #adadad;
        }

    </style>
</head>
<body>
    <h1>Anatomia de tabelas grandes</h1>
    <!--
        TABLE
            CAPTION
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->
    <table>
        <caption>
            Unidades federativas do sudeste
        </caption>
        <thead>
            <tr>
                <th>Estado(Sudeste)</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 393 441</td>
            </tr>
            <tr>
                <td>Rio de janeiro</td>
                <td class="num">17 223 547</td>
            </tr>
            <tr>
                <td>Espirito Santo</td>
                <td class="num">4 126 854</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total de habitantes</th>
                <td class="num"><strong>88 825 643</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
